# Prometheus configuration for Docker Compose deployment.
# K8s deployment uses the ConfigMap in k8s/configmaps.yaml instead.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "intelligent-sre-agent"
    static_configs:
      - targets: ["api:8080"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:9464"]
