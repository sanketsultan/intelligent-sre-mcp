name: Release

on:
  push:
    tags:
      - "v*"   # Triggered by: git tag v1.0.0 && git push --tags

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # sanketsultan/intelligent-sre-mcp

jobs:
  build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to GHCR

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with the git tag (e.g. v1.0.0)
            type=semver,pattern={{version}}
            # Tag with major.minor (e.g. v1.0)
            type=semver,pattern={{major}}.{{minor}}
            # Always update :latest on a versioned release
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Docker Image

            ```bash
            docker pull ghcr.io/sanketsultan/intelligent-sre-mcp:${{ github.ref_name }}
            ```

            ## Kubernetes deployment

            ```bash
            kubectl set image deployment/intelligent-sre-mcp \
              intelligent-sre-mcp=ghcr.io/sanketsultan/intelligent-sre-mcp:${{ github.ref_name }} \
              -n intelligent-sre
            ```
