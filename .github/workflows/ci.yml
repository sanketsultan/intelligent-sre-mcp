name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Cancel in-progress runs for the same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"

jobs:
  # ---------------------------------------------------------------------------
  # Lint – ruff check + format check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install ruff
        run: uv tool install "ruff>=0.8,<1"

      - name: Check formatting
        run: ruff format --check src/ tests/

      - name: Check linting
        run: ruff check src/ tests/

  # ---------------------------------------------------------------------------
  # Test – pytest with coverage
  # ---------------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "requirements.txt"

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system -e .
          uv pip install --system pytest pytest-cov pytest-asyncio requests

      - name: Run tests
        env:
          # Use SQLite for unit tests – no K8s or Postgres needed
          ACTION_HISTORY_DB: ""
          PROMETHEUS_URL: "http://localhost:9090"
          ENABLE_TRACING: "false"
        run: |
          # Skip integration tests – they require a live API server on :30080.
          # Exit code 5 means "no tests collected" (all tests are integration);
          # treat that as success until unit tests are added.
          pytest tests/ \
            -m "not integration" \
            --cov=src/intelligent_sre_mcp \
            --cov-report=xml \
            --cov-report=term-missing \
            -v \
          || [ "$?" = "5" ]

      - name: Upload coverage
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ---------------------------------------------------------------------------
  # Validate K8s manifests – kubeconform
  # ---------------------------------------------------------------------------
  validate-k8s:
    name: Validate K8s Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
          chmod +x /usr/local/bin/kubeconform

      - name: Validate manifests
        run: |
          # alert_rules.yaml contains Prometheus rule groups, not K8s resources – skip it
          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -kubernetes-version 1.29.0 \
            -summary \
            $(ls k8s/*.yaml | grep -v alert_rules.yaml)

  # ---------------------------------------------------------------------------
  # Docker build – validates the image builds cleanly (no push on CI)
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: intelligent-sre-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Fail if the image has any CRITICAL vulnerabilities
          # (remove this if you want to suppress trivy errors)
          load: true

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: intelligent-sre-mcp:ci
          format: table
          exit-code: "0"        # warn but don't block; change to "1" to block
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
