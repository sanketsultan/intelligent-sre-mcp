name: Deploy

# ---------------------------------------------------------------------------
# Triggers
# ---------------------------------------------------------------------------
# Manual:  workflow_dispatch → pick environment + optional image tag override
# Auto:    push to master    → build + deploy dev
# Auto:    push v* tag       → build + deploy prod (requires env approval)
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, prod]
      image_tag:
        description: "Image tag to deploy (leave empty to build from this commit)"
        required: false
        type: string

  push:
    branches: [master]   # auto-deploy dev on every merge
    tags:     ["v*"]     # auto-deploy prod on version tags

# ---------------------------------------------------------------------------
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   AWS_ROLE_ARN_DEV   — IAM role ARN with EKS + ECR access for dev
#   AWS_ROLE_ARN_PROD  — IAM role ARN with EKS + ECR access for prod
#
# Required GitHub variables (Settings → Secrets and variables → Variables):
#   AWS_REGION             — e.g. us-east-1
#   EKS_CLUSTER_NAME_DEV   — e.g. intelligent-sre-dev
#   EKS_CLUSTER_NAME_PROD  — e.g. intelligent-sre
#
# Required GitHub Environments (Settings → Environments):
#   dev  — no protection rules (auto-deploy)
#   prod — add "Required reviewers" for manual approval gate
# ---------------------------------------------------------------------------

env:
  REGISTRY:   ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: deploy-${{ github.event.inputs.environment || (startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev') }}
  cancel-in-progress: false   # never cancel an in-flight deployment

jobs:
  # -------------------------------------------------------------------------
  # Build & push Docker image to GHCR
  # Skip when image_tag is explicitly provided (re-deploy existing image)
  # -------------------------------------------------------------------------
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    if: github.event.inputs.image_tag == ''
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags:      ${{ steps.meta.outputs.tags }}
          labels:    ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build summary
        run: |
          echo "### Image built 🐳" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| version | \`${{ steps.meta.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| digest  | \`${{ steps.build-push.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY

  # -------------------------------------------------------------------------
  # Deploy → dev
  # Runs on: push to master  OR  manual dispatch with environment=dev
  # -------------------------------------------------------------------------
  deploy-dev:
    name: Deploy → dev
    needs: build
    if: |
      always() &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (
        (github.event_name == 'push'              && github.ref == 'refs/heads/master') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
      )
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://dev.intelligent-sre.example.com   # update to your real URL
    permissions:
      id-token: write   # OIDC — no long-lived AWS keys
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag || needs.build.outputs.image_tag }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Deploying image tag: ${TAG}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region:     ${{ vars.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name   ${{ vars.EKS_CLUSTER_NAME_DEV }} \
            --region ${{ vars.AWS_REGION }}

      - name: Set image tag in overlay
        run: |
          cd k8s/overlays/dev
          kustomize edit set image \
            ghcr.io/${{ env.IMAGE_NAME }}=ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}

      - name: Apply manifests (dry-run first)
        run: |
          kubectl apply -k k8s/overlays/dev --dry-run=server
          kubectl apply -k k8s/overlays/dev

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/intelligent-sre-mcp \
            -n intelligent-sre --timeout=300s

      - name: Deployment summary
        run: |
          echo "### Deployed to **dev** ✅" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | dev |" >> $GITHUB_STEP_SUMMARY
          echo "| Image tag   | \`${{ steps.tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Cluster     | \`${{ vars.EKS_CLUSTER_NAME_DEV }}\` |" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n intelligent-sre -l app=intelligent-sre-mcp \
            --no-headers | awk '{print $1, $2, $3}' >> $GITHUB_STEP_SUMMARY

  # -------------------------------------------------------------------------
  # Deploy → prod
  # Runs on: push v* tag  OR  manual dispatch with environment=prod
  # Protected by GitHub Environment approval gate — set reviewers in
  # Settings → Environments → prod → Required reviewers
  # -------------------------------------------------------------------------
  deploy-prod:
    name: Deploy → prod
    needs: build
    if: |
      always() &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (
        (github.event_name == 'push'              && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')
      )
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://intelligent-sre.example.com   # update to your real URL
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag || needs.build.outputs.image_tag }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Deploying image tag: ${TAG}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region:     ${{ vars.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name   ${{ vars.EKS_CLUSTER_NAME_PROD }} \
            --region ${{ vars.AWS_REGION }}

      - name: Set image tag in overlay
        run: |
          cd k8s/overlays/prod
          kustomize edit set image \
            ghcr.io/${{ env.IMAGE_NAME }}=ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}

      - name: Apply manifests (dry-run first)
        run: |
          kubectl apply -k k8s/overlays/prod --dry-run=server
          kubectl apply -k k8s/overlays/prod

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/intelligent-sre-mcp \
            -n intelligent-sre --timeout=300s

      - name: Deployment summary
        run: |
          echo "### Deployed to **prod** ✅" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | prod |" >> $GITHUB_STEP_SUMMARY
          echo "| Image tag   | \`${{ steps.tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Cluster     | \`${{ vars.EKS_CLUSTER_NAME_PROD }}\` |" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n intelligent-sre -l app=intelligent-sre-mcp \
            --no-headers | awk '{print $1, $2, $3}' >> $GITHUB_STEP_SUMMARY
