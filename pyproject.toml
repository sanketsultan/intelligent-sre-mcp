[project]
name = "intelligent-sre-mcp"
version = "0.1.0"
description = "MCP server for intelligent SRE operations (local Prometheus/Alertmanager/OTel)"
requires-python = ">=3.10"
dependencies = [
  "mcp",
  "anthropic>=0.40,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "slack-bolt>=1.18,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Linting: ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
  "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["intelligent_sre_mcp"]

# ---------------------------------------------------------------------------
# Testing: pytest + coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -q -m 'not integration'"
markers = [
    "integration: tests that require a live API server (skip in CI with -m 'not integration')",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0   # raise this as unit tests are added
