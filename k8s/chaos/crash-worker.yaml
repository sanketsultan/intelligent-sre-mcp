---
# crash-worker: simulates a misconfigured deployment where a bad env var causes
# the application to crash on every startup.
#
# Failure mode: CrashLoopBackOff — SIMULATE_CRASH=true makes the process exit 1.
# This is realistic: a wrong feature-flag or secret value causes app crashes.
#
# Agent fix (preferred): patch_deployment to set SIMULATE_CRASH=false.
#   patch: {"spec":{"template":{"spec":{"containers":[{"name":"crash-worker",
#           "env":[{"name":"SIMULATE_CRASH","value":"false"}]}]}}}}
# After the patch K8s replaces pods with the corrected config -> Running/Ready.
#
# Secondary effect: crash-worker-svc has no ready endpoints while pods crash,
# so dependent-worker's init container fails (cascading failure).
# dependent-worker recovers automatically once crash-worker becomes healthy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crash-worker
  namespace: intelligent-sre
  labels:
    app: crash-worker
    chaos-test: "true"
    failure-mode: crash-loop
  annotations:
    # Hint for the SRE agent: documents what the correct fix is.
    sre.io/failure-cause: "SIMULATE_CRASH env var set to true — patch it to false"
    sre.io/fix-patch: '{"spec":{"template":{"spec":{"containers":[{"name":"crash-worker","env":[{"name":"SIMULATE_CRASH","value":"false"}]}]}}}}'
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crash-worker
  template:
    metadata:
      labels:
        app: crash-worker
        chaos-test: "true"
        failure-mode: crash-loop
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: crash-worker
          image: busybox:1.36
          env:
            # Set to "false" to fix the deployment (the agent patches this).
            - name: SIMULATE_CRASH
              value: "true"
          command:
            - sh
            - -c
            - |
              echo "crash-worker: starting up..."
              sleep 2
              if [ "${SIMULATE_CRASH}" = "true" ]; then
                echo "crash-worker: SIMULATE_CRASH=true — exiting with error"
                exit 1
              fi
              echo "crash-worker: SIMULATE_CRASH=false — running normally"
              # Serve a minimal HTTP response so dependent-worker's wget succeeds.
              while true; do
                echo -e "HTTP/1.1 200 OK\r\nContent-Length: 2\r\n\r\nOK" \
                  | nc -l -p 8080 -q 1 2>/dev/null || sleep 1
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
---
# Service for crash-worker — will have no ready endpoints while pods are crashing.
# dependent-worker's init container tries to reach this, causing the cascade.
# Once crash-worker is fixed and pods become Ready, this service gets endpoints
# and dependent-worker's init container can succeed on retry.
apiVersion: v1
kind: Service
metadata:
  name: crash-worker-svc
  namespace: intelligent-sre
  labels:
    app: crash-worker
    chaos-test: "true"
spec:
  selector:
    app: crash-worker
  ports:
    - port: 8080
      targetPort: 8080
