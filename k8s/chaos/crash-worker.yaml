---
# crash-worker: simulates an application that exits with a non-zero exit code.
# Result: CrashLoopBackOff — K8s keeps restarting it with exponential back-off.
# Agent fix: delete_failed_pods to clear backoff, then scale to 0 to stop the loop.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crash-worker
  namespace: intelligent-sre
  labels:
    app: crash-worker
    chaos-test: "true"
    failure-mode: crash-loop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crash-worker
  template:
    metadata:
      labels:
        app: crash-worker
        chaos-test: "true"
        failure-mode: crash-loop
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: crash-worker
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "crash-worker: starting up..."
              sleep 3
              echo "crash-worker: fatal error — database connection refused"
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
---
# Service for crash-worker — will have no ready endpoints since the pod never
# stays Running. dependent-worker tries to reach this and fails (the cascade).
apiVersion: v1
kind: Service
metadata:
  name: crash-worker-svc
  namespace: intelligent-sre
  labels:
    app: crash-worker
    chaos-test: "true"
spec:
  selector:
    app: crash-worker
  ports:
    - port: 8080
      targetPort: 8080
