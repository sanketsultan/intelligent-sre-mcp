---
# Promtail – log shipper DaemonSet that scrapes pod logs and pushes to Loki
# Version: 3.2.1  |  Image: grafana/promtail:3.2.1
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: intelligent-sre
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind:      ClusterRole
  name:      promtail
subjects:
  - kind:      ServiceAccount
    name:      promtail
    namespace: intelligent-sre
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: intelligent-sre
data:
  promtail.yaml: |
    server:
      http_listen_port: 3101
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push
        tenant_id: intelligent-sre

    scrape_configs:
      # -----------------------------------------------------------------------
      # Scrape all pod logs from the node's /var/log/pods directory
      # -----------------------------------------------------------------------
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          # Detect JSON structured logs and parse them
          - match:
              selector: '{app=~".+"}'
              stages:
                - json:
                    expressions:
                      ts:         ts
                      level:      level
                      logger:     logger
                      msg:        msg
                      http_method: http_method
                      http_path:   http_path
                      http_status: http_status
                      duration_ms: duration_ms
                      problem_id:  problem_id
                - labels:
                    level:       ""
                    logger:      ""
                    http_method: ""
                    http_path:   ""
                - timestamp:
                    source: ts
                    format: RFC3339Nano
          # Detect Falco JSON events (different schema)
          - match:
              selector: '{app="falco"}'
              stages:
                - json:
                    expressions:
                      priority: priority
                      rule:     rule
                      output:   output
                - labels:
                    priority: ""
                    rule:     ""

        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_controller_name]
            action: replace
            target_label: __service__
          - source_labels: [__meta_kubernetes_pod_node_name]
            action: replace
            target_label: __host__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            action: replace
            target_label: container
          - replacement: /var/log/pods/*$1/*.log
            separator: /
            source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            target_label: __path__
          - action: replace
            regex: true/(.*)
            replacement: /var/log/pods/*$1/*.log
            separator: /
            source_labels:
              - __meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash
              - __meta_kubernetes_pod_annotation_kubernetes_io_config_hash
              - __meta_kubernetes_pod_container_name
            target_label: __path__
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: intelligent-sre
  labels:
    app: promtail
    version: "3.2.1"
spec:
  selector:
    matchLabels:
      app: promtail
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: promtail
        version: "3.2.1"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "3101"
        prometheus.io/path:   "/metrics"
    spec:
      serviceAccountName: promtail
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
      securityContext:
        runAsGroup: 0
        runAsUser:  0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: promtail
          image: grafana/promtail:3.2.1
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/promtail/promtail.yaml
          ports:
            - name: http
              containerPort: 3101
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem:   true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu:    50m
              memory: 64Mi
            limits:
              cpu:    200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 3101
            initialDelaySeconds: 10
            periodSeconds:       10
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
              readOnly:  true
            - name: run
              mountPath: /run/promtail
            - name: varlog
              mountPath: /var/log
              readOnly:  true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly:  true
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: run
          hostPath:
            path: /run/promtail
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
