# NetworkPolicy – restrict pod-to-pod traffic within the intelligent-sre namespace.
# Default deny-all is set by the first policy; subsequent policies open only
# the specific paths that each service needs.

---
# 1. Default deny all ingress + egress within the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: intelligent-sre
spec:
  podSelector: {}   # matches every pod in the namespace
  policyTypes:
    - Ingress
    - Egress

---
# 2. Allow DNS resolution for all pods (required for service discovery)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: intelligent-sre
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

---
# 3. intelligent-sre-agent – ingress from any pod in the namespace + NodePort traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sre-mcp-ingress
  namespace: intelligent-sre
spec:
  podSelector:
    matchLabels:
      app: intelligent-sre-agent
  policyTypes:
    - Ingress
  ingress:
    # Allow from any pod in the same namespace (Claude Desktop connects via NodePort proxy)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: intelligent-sre

---
# 4. intelligent-sre-agent – egress to Prometheus, PostgreSQL, OTel collector
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sre-mcp-egress
  namespace: intelligent-sre
spec:
  podSelector:
    matchLabels:
      app: intelligent-sre-agent
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 9090
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - port: 4317   # gRPC
        - port: 4318   # HTTP
    # Allow Kubernetes API server access (for K8s tools)
    - ports:
        - port: 443
        - port: 6443

---
# 5. Prometheus – ingress from intelligent-sre-agent and Grafana
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-ingress
  namespace: intelligent-sre
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: intelligent-sre-agent
        - podSelector:
            matchLabels:
              app: grafana
        - podSelector:
            matchLabels:
              app: alertmanager

---
# 6. Prometheus – egress to scrape targets
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-egress
  namespace: intelligent-sre
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Egress
  egress:
    # Scrape node-exporter, kube-state-metrics, otel-collector, demo-metrics
    - to:
        - podSelector:
            matchLabels:
              app: node-exporter
      ports:
        - port: 9100
    - to:
        - podSelector:
            matchLabels:
              app: kube-state-metrics
      ports:
        - port: 8080
    - to:
        - podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - port: 9464
    - to:
        - podSelector:
            matchLabels:
              app: demo-metrics
      ports:
        - port: 9102
    - to:
        - podSelector:
            matchLabels:
              app: alertmanager
      ports:
        - port: 9093

---
# 7. PostgreSQL – ingress only from intelligent-sre-agent
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-ingress
  namespace: intelligent-sre
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: intelligent-sre-agent
      ports:
        - port: 5432

---
# 8. Grafana – ingress from any pod in namespace (UI access via NodePort)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-ingress
  namespace: intelligent-sre
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: intelligent-sre

---
# 9. Alertmanager – ingress from Prometheus (alert delivery) and NodePort traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alertmanager-ingress
  namespace: intelligent-sre
spec:
  podSelector:
    matchLabels:
      app: alertmanager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 9093
    # Allow NodePort access from outside the cluster
    - ports:
        - port: 9093

---
# 10. Scrape targets – ingress from Prometheus (metrics collection)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-scrape-target-ingress
  namespace: intelligent-sre
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - kube-state-metrics
          - otel-collector
          - demo-metrics
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
