apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: intelligent-sre
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]

    rule_files:
      - /etc/prometheus/alert_rules.yml

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["prometheus:9090"]

      - job_name: "node-exporter"
        static_configs:
          - targets: ["node-exporter:9100"]
      
      - job_name: "demo-metrics"
        static_configs:
          - targets: ["demo-metrics:9102"]
      
      - job_name: "otel-collector"
        static_configs:
          - targets: ["otel-collector:9464"]
      
      - job_name: "kube-state-metrics"
        # kube-state-metrics generates many metrics; allow more time than the global default
        scrape_timeout: 30s
        scrape_interval: 30s
        static_configs:
          - targets: ["kube-state-metrics:8080"]

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: intelligent-sre
data:
  alert_rules.yml: |
    groups:
      - name: intelligent_sre_alerts
        interval: 30s
        rules:
          # High Severity Alerts
          - alert: PodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total[15m]) > 0
            for: 5m
            labels:
              severity: critical
              category: pod_health
            annotations:
              summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
              description: "Container {{ $labels.container }} has restarted {{ $value }} times in 15 minutes"

          - alert: PodNotReady
            expr: kube_pod_status_ready{condition="false"} == 1
            for: 10m
            labels:
              severity: warning
              category: pod_health
            annotations:
              summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} not ready"
              description: "Pod has been in not-ready state for more than 10 minutes"

          - alert: HighCPUUsage
            expr: sum(rate(container_cpu_usage_seconds_total{container!=""}[5m])) by (namespace, pod) * 100 > 80
            for: 10m
            labels:
              severity: warning
              category: resource
            annotations:
              summary: "High CPU usage in {{ $labels.namespace }}/{{ $labels.pod }}"
              description: "Pod CPU usage is {{ $value | humanize }}%"

          - alert: HighMemoryUsage
            expr: |
              (sum(container_memory_working_set_bytes{container!=""}) by (namespace, pod) 
              / sum(container_spec_memory_limit_bytes{container!=""}) by (namespace, pod)) * 100 > 85
            for: 10m
            labels:
              severity: warning
              category: resource
            annotations:
              summary: "High memory usage in {{ $labels.namespace }}/{{ $labels.pod }}"
              description: "Pod memory usage is {{ $value | humanize }}% of limit"

          - alert: ServiceDown
            expr: up{job!="kubernetes-pods"} == 0
            for: 5m
            labels:
              severity: critical
              category: availability
            annotations:
              summary: "Service {{ $labels.job }} is down"
              description: "Target {{ $labels.instance }} has been down for more than 5 minutes"
              
  # alert_rules.yml: |
  #   groups:
  #     - name: basic
  #       rules:
  #         - alert: NodeExporterDown
  #           expr: up{job="node-exporter"} == 0
  #           for: 30s
  #           labels:
  #             severity: warning
  #           annotations:
  #             summary: "Node Exporter is down"
  #             description: "Prometheus cannot scrape node-exporter for 30s."

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: intelligent-sre
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: sre-agent
      group_by: [alertname, severity, namespace]
      group_wait: 10s       # wait 10s to batch alerts in the same group
      group_interval: 5m    # resend if new alerts join the group
      repeat_interval: 1h   # re-fire if still firing after 1 hour

      routes:
        # critical alerts go straight to the agent for immediate remediation
        - matchers:
            - severity = critical
          receiver: sre-agent
          group_wait: 5s
          repeat_interval: 30m

        # warning alerts are batched and sent less urgently
        - matchers:
            - severity = warning
          receiver: sre-agent
          group_wait: 30s
          repeat_interval: 2h

    receivers:
      - name: sre-agent
        webhook_configs:
          - url: "http://intelligent-sre-agent.intelligent-sre.svc.cluster.local:8080/alertmanager/webhook"
            send_resolved: true
            max_alerts: 20     # cap payload size per POST

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: intelligent-sre
data:
  otel-collector.yml: |
    receivers:
      otlp:
        protocols:
          grpc:
          http:

    exporters:
      prometheus:
        endpoint: "0.0.0.0:9464"

    service:
      pipelines:
        metrics:
          receivers: [otlp]
          exporters: [prometheus]
