---
apiVersion: v1
kind: Service
metadata:
  name: intelligent-sre-mcp
  namespace: intelligent-sre
  labels:
    app: intelligent-sre-mcp
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
      name: http
  selector:
    app: intelligent-sre-mcp

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intelligent-sre-mcp
  namespace: intelligent-sre
  labels:
    app: intelligent-sre-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intelligent-sre-mcp
  template:
    metadata:
      labels:
        app: intelligent-sre-mcp
    spec:
      serviceAccountName: intelligent-sre-mcp

      # Pod-level security: run as non-root, no privilege escalation
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # Block the main container until Postgres is accepting connections.
      # Uses pg_isready from the same postgres image to avoid adding new deps.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16.4-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER"; do
                echo "waiting for postgres..."; sleep 2;
              done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_USER
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL

      containers:
        - name: intelligent-sre-mcp
          image: intelligent-sre-mcp:latest
          imagePullPolicy: Never  # Use local image; change to IfNotPresent for registry
          env:
            - name: PROMETHEUS_URL
              value: "http://prometheus:9090"
            - name: OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: ENABLE_TRACING
              value: "false"
            - name: REQUEST_TIMEOUT
              value: "10"
            - name: SERVICE_NAME
              value: "intelligent-sre-mcp"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_DB
            - name: ACTION_HISTORY_DB
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-credentials
                  key: ANTHROPIC_API_KEY

          # Container-level security: drop all capabilities, read-only FS
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          # Writable scratch space for SQLite fallback and temp files
          volumeMounts:
            - name: tmp
              mountPath: /tmp

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          # Real HTTP health checks against the /health endpoint
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12   # up to 60s for startup

      volumes:
        - name: tmp
          emptyDir: {}
