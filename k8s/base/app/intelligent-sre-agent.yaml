---
apiVersion: v1
kind: Service
metadata:
  name: intelligent-sre-agent
  namespace: intelligent-sre
  labels:
    app: intelligent-sre-agent
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
      name: http
  selector:
    app: intelligent-sre-agent

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intelligent-sre-agent
  namespace: intelligent-sre
  labels:
    app: intelligent-sre-agent
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0        # kill old pod before creating new — avoids CPU quota exhaustion
      maxUnavailable: 1  # one pod down at a time is fine for this workload
  selector:
    matchLabels:
      app: intelligent-sre-agent
  template:
    metadata:
      labels:
        app: intelligent-sre-agent
    spec:
      serviceAccountName: intelligent-sre-agent

      # Pod-level security: run as non-root, no privilege escalation
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # Block the main container until Postgres is accepting connections.
      # Uses pg_isready from the same postgres image to avoid adding new deps.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16.4-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER"; do
                echo "waiting for postgres..."; sleep 2;
              done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_USER
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL

      containers:
        - name: intelligent-sre-agent
          image: intelligent-sre-agent:latest
          imagePullPolicy: Never  # Use local image; change to IfNotPresent for registry
          env:
            - name: PROMETHEUS_URL
              value: "http://prometheus:9090"
            - name: OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: ENABLE_TRACING
              value: "false"
            - name: REQUEST_TIMEOUT
              value: "10"
            - name: SERVICE_NAME
              value: "intelligent-sre-agent"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_DB
            - name: ACTION_HISTORY_DB
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-credentials
                  key: ANTHROPIC_API_KEY
            # In-pod agent calls back to the API server on its internal port (8080),
            # not the external NodePort (30080) which is unreachable inside the pod.
            - name: API_URL
              value: "http://localhost:8080"
            # Use sonnet for webhook-triggered remediation; haiku for read-only investigation.
            - name: SRE_REMEDIATION_MODEL
              value: "claude-sonnet-4-5"
            # Model used when sonnet leaves deployments STILL BROKEN — escalate before paging human.
            - name: SRE_ESCALATION_MODEL
              value: "claude-opus-4-6"
            # Output token ceiling for the Phase 2 remediation pass.  max_tokens is a
            # ceiling not a floor — you only pay for tokens actually generated.  4096 is
            # sufficient for all normal remediation responses; raise if the agent response
            # appears truncated (remediation_summary ends with "...").
            - name: SRE_MAX_TOKENS
              value: "4096"
            # Max chars of Phase 1 investigation embedded in the Phase 2 sonnet prompt.
            # Root-cause detail appears in the first ~3000 chars; the rest is raw log noise.
            - name: SRE_INVESTIGATION_CTX_CHARS
              value: "3000"
            # Minimum alert severity that triggers auto-remediation (Phase 2).
            # "critical" = only critical alerts (default). "warning" = warning + critical.
            - name: SRE_AUTO_REMEDIATE_SEVERITY
              value: "critical"
            # Health score (0-100) below which the proactive CronJob triggers remediation.
            - name: SRE_PROACTIVE_HEALTH_THRESHOLD
              value: "50"
            # GitHub incident tickets — auto-created when the agent cannot remediate.
            # Set GITHUB_REPO to "owner/repo" (e.g. "acme/infra-incidents").
            # Leave empty to disable GitHub ticket creation.
            - name: GITHUB_REPO
              value: "sanketsultan/intelligent-sre-agent"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-credentials
                  key: GITHUB_TOKEN
                  optional: true  # pod still starts if secret is absent

          # Container-level security: drop all capabilities, read-only FS
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          # Writable scratch space for SQLite fallback and temp files
          volumeMounts:
            - name: tmp
              mountPath: /tmp

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          # Real HTTP health checks against the /health endpoint
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12   # up to 60s for startup

      volumes:
        - name: tmp
          emptyDir: {}
