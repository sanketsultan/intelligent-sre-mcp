apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Gatekeeper and Falco are cluster-level components that manage their own
# namespaces and CRDs.  They must be installed separately so the global
# "namespace: intelligent-sre" transformation in the base kustomization does
# not corrupt their cluster-scoped resources.
#
# Install Gatekeeper (one-time, cluster-admin required):
#   kubectl apply -k k8s/base/security/gatekeeper/
#
# Install Falco (one-time, DaemonSet, requires privileged):
#   kubectl apply -k k8s/base/security/falco/
resources: []
