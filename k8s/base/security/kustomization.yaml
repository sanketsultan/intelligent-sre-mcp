  - gatekeeper/install.yaml
  - gatekeeper/templates/require-labels.yaml
  - gatekeeper/templates/no-latest-tag.yaml
  - gatekeeper/templates/require-resources.yaml
  - gatekeeper/templates/require-non-root.yaml
  - gatekeeper/constraints/require-labels.yaml
