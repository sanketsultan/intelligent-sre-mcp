apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Install with: kubectl apply -k k8s/base/security/gatekeeper/
# Requires cluster-admin.  Gatekeeper manages its own namespace (gatekeeper-system).
resources:
  - install.yaml
  - templates/require-labels.yaml
  - templates/no-latest-tag.yaml
  - templates/require-resources.yaml
  - templates/require-non-root.yaml
  - constraints/require-labels.yaml
  - constraints/no-latest-tag.yaml
  - constraints/require-resources.yaml
  - constraints/require-non-root.yaml
