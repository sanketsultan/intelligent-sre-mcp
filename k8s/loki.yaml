---
# Loki – single-binary log aggregation backend for Grafana
# Version: 3.2.1  |  Image: grafana/loki:3.2.1
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: intelligent-sre
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info

    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory:  /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100

    schema_config:
      configs:
        - from: 2024-01-01
          store:  tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    ruler:
      alertmanager_url: http://alertmanager:9093

    limits_config:
      reject_old_samples:          true
      reject_old_samples_max_age:  168h   # 7 days
      ingestion_rate_mb:           16
      ingestion_burst_size_mb:     32
      max_query_length:            0
      split_queries_by_interval:   15m

    # Retention
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      retention_delete_delay: 2h

    limits_config_override:
      # Keep 30 days of logs
      retention_period: 720h
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: intelligent-sre
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: intelligent-sre
  labels:
    app: loki
    version: "3.2.1"
spec:
  serviceName: loki
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
        version: "3.2.1"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "3100"
        prometheus.io/path:   "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser:    10001
        runAsGroup:   10001
        fsGroup:      10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loki
          image: grafana/loki:3.2.1
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/loki/loki.yaml
          ports:
            - name: http
              containerPort: 3100
            - name: grpc
              containerPort: 9096
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem:   true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu:    50m
              memory: 128Mi
            limits:
              cpu:    500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 45
            periodSeconds:       15
            timeoutSeconds:      5
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 15
            periodSeconds:       10
          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly:  true
            - name: data
              mountPath: /loki
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: intelligent-sre
  labels:
    app: loki
spec:
  selector:
    app: loki
  ports:
    - name: http
      port:       3100
      targetPort: 3100
    - name: grpc
      port:       9096
      targetPort: 9096
