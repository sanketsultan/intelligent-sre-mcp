apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: intelligent-sre

resources:
  # ---- Core infrastructure ----
  - namespace.yaml
  - pod-security.yaml         # Pod Security Standards (namespace labels)
  - resource-limits.yaml      # ResourceQuota + LimitRange (apply before workloads)
  - rbac.yaml
  - configmaps.yaml

  # ---- Data stores ----
  - postgres.yaml

  # ---- Observability stack ----
  - prometheus.yaml
  - slo-rules.yaml            # SLO recording rules + burn rate alerts
  - dora-rules.yaml           # DORA metrics recording rules + alerts
  - alertmanager.yaml
  - node-exporter.yaml
  - kube-state-metrics.yaml
  - otel-collector.yaml
  - jaeger.yaml
  - loki.yaml                 # Loki log aggregation
  - promtail.yaml             # Promtail log shipper (DaemonSet)
  - grafana.yaml              # Grafana (pinned 11.3.2, Loki datasource, dashboards)
  - grafana-dashboards/slo-dashboard.yaml
  - grafana-dashboards/dora-dashboard.yaml

  # ---- Application ----
  - demo-metrics.yaml
  - intelligent-sre-mcp.yaml

  # ---- Security policies ----
  - gatekeeper/install.yaml
  - gatekeeper/templates/require-labels.yaml
  - gatekeeper/templates/no-latest-tag.yaml
  - gatekeeper/templates/require-resources.yaml
  - gatekeeper/templates/require-non-root.yaml
  - gatekeeper/constraints/require-labels.yaml
  - gatekeeper/constraints/no-latest-tag.yaml
  - gatekeeper/constraints/require-resources.yaml
  - gatekeeper/constraints/require-non-root.yaml

  # ---- Runtime security ----
  # Falco runs in its own namespace; apply separately:
  #   kubectl apply -k k8s/falco/
  # Included here for documentation; comment out if Falco is managed via Helm.
  # - falco/falco.yaml
  # - falco/falco-config.yaml
  # - falco/falco-rules.yaml
  # - falco/falco-sidekick.yaml

  # ---- Traffic management ----
  - network-policy.yaml       # NetworkPolicies (applied after workloads exist)
  - hpa.yaml                  # HPA (requires metrics-server)

commonLabels:
  project: intelligent-sre-mcp
  managed-by: kustomize
