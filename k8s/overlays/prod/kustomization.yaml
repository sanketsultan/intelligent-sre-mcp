# Prod overlay — uses RDS (Terraform-provisioned), no local postgres
# Usage: kubectl apply -k k8s/overlays/prod
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: intelligent-sre

resources:
  - ../../base

# Image tag is injected by CI:
#   kustomize edit set image ghcr.io/sanketsultan/intelligent-sre-mcp=ghcr.io/sanketsultan/intelligent-sre-mcp:<tag>
images:
  - name: ghcr.io/sanketsultan/intelligent-sre-mcp
    newTag: latest

# Add prod patches here, e.g.:
# patches:
#   - path: patches/replica-count.yaml
