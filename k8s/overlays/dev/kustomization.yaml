# Dev overlay — extends base with local PostgreSQL and demo workloads
# Usage: kubectl apply -k k8s/overlays/dev
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: intelligent-sre

resources:
  - ../../base
  - postgres.yaml
  - postgres-pv.yaml
  - demo-metrics.yaml

# Image tag is injected by CI:
#   kustomize edit set image ghcr.io/sanketsultan/intelligent-sre-mcp=ghcr.io/sanketsultan/intelligent-sre-mcp:<tag>
images:
  - name: ghcr.io/sanketsultan/intelligent-sre-mcp
    newTag: latest
